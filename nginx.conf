server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/retro-blog;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # RSS and podcast XML feeds (short cache so subscribers get fresh content)
    location ~* \.(xml|rss)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
        default_type application/rss+xml;
    }

    # Feed shortcuts & aliases
    location = /feed {
        return 301 /rss.xml;
    }
    location = /feed.xml {
        return 301 /rss.xml;
    }
    location = /podcast.xml {
        return 301 /audio/rss.xml;
    }

    # Optimize caching for static assets
    location ~* \.(css|js|ico|gif|jpeg|jpg|png|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Optimize streaming for audio files
    location ~* \.(mp3|wav|ogg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Accept-Ranges bytes;
    }
}
