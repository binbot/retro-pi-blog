<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>binbot</title>
  <meta name="description" content="binbot - a lightweight digital outpost hosted on a retro Raspberry Pi.">
  <link rel="stylesheet" href="/style.css?v=2.2">
</head>
<body class="landing-page">
  <div class="landing-container">
    <div class="pd-object-wrapper">
      <!-- Clickable Pure Data Object -->
      <div class="pd-object" id="binbot-trigger" aria-haspopup="true" aria-expanded="false" role="button" tabindex="0">
        binbot
        <div class="pd-clickable-corner"></div>
      </div>
      
      <!-- SVG for patch cords -->
      <svg class="patch-cords-svg" id="patch-cords"></svg>
      
      <!-- Subpages Menu -->
      <nav class="pd-menu" id="pd-menu" aria-label="Main Navigation">
        <a href="/about/" class="pd-message" id="menu-about">about</a>
        <a href="/audio/" class="pd-message" id="menu-audio">audio</a>
        <a href="/blog/" class="pd-message" id="menu-blog">blog</a>
      </nav>
    </div>
    
    <!-- Theme Selector at the bottom -->
    <div class="landing-theme-selector">
      Theme:
      <button class="theme-btn" data-set-theme="paper">Warm Paper</button>
      <button class="theme-btn" data-set-theme="dark">Dark Mode</button>
      <button class="theme-btn" data-set-theme="amber">Amber Terminal</button>
      <button class="theme-btn" data-set-theme="green">Green Terminal</button>
    </div>
  </div>

  <script src="/script.js?v=2.2"></script>
</body>
</html>
